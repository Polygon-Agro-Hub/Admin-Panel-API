name: Database Backup

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install MySQL Client and Cloudinary CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          python3 -m pip install --upgrade cloudinary

      - name: Backup Database
        env:
          MYSQLHOST: ${{ secrets.MYSQLHOST }}
          MYSQLPORT: ${{ secrets.MYSQLPORT }}
          MYSQLUSER: ${{ secrets.MYSQLUSER }}
          MYSQLPASSWORD: ${{ secrets.MYSQLPASSWORD }}
          MYSQLDATABASE: ${{ secrets.MYSQLDATABASE }}
        run: |
          DATE=$(date +"%Y-%m-%d-%H-%M-%S")

          mysqldump \
            -h "$MYSQLHOST" \
            -P "$MYSQLPORT" \
            -u "$MYSQLUSER" \
            -p"$MYSQLPASSWORD" \
            "$MYSQLDATABASE" \
            > backup-$DATE.sql

          gzip backup-$DATE.sql

      - name: Upload Backup to Cloudinary
        env:
          CLOUDINARY_URL: cloudinary://916111651833897:n0SgLgIL4p9T4T04aaikgxPNx6A@djwd2y0ih
        run: |
          python3 <<'EOF'
          import glob
          import os
          import cloudinary
          import cloudinary.uploader

          cloudinary.config()

          backup = glob.glob("backup-*.sql.gz")[0]

          result = cloudinary.uploader.upload(
              backup,
              resource_type="raw",
              folder="database-backups",
              use_filename=True,
              unique_filename=False,
              overwrite=False
          )

          print("Uploaded:", result["secure_url"])
          EOF

      - name: Cleanup
        run: rm -f backup-*.sql.gz